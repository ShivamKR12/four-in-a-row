name: Build Desktop Executables

on:
  push:
    paths:
      - 'main.py'
      - 'four-in-a-row.spec'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame-ce

      - name: Build with PyInstaller
        run: pyinstaller four-in-a-row.spec

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Four-in-a-Row.exe -DestinationPath four-in-a-row-windows.zip

      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: tar -czvf four-in-a-row-linux.tar.gz -C dist Four-in-a-Row

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: zip -j four-in-a-row-macos.zip dist/Four-in-a-Row

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: four-in-a-row-${{ runner.os }}
          path: |
            four-in-a-row-*.zip
            four-in-a-row-*.tar.gz

  release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Four in a Row v${{ github.run_number }}
          files: |
            artifacts/four-in-a-row-Windows/four-in-a-row-windows.zip
            artifacts/four-in-a-row-Linux/four-in-a-row-linux.tar.gz
            artifacts/four-in-a-row-macOS/four-in-a-row-macos.zip

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v1

      - name: Publish Windows to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_win
          cp artifacts/four-in-a-row-Windows/four-in-a-row-windows.zip push_win/
          butler push push_win shivamkr12/four-in-a-row:windows --userversion v${{ github.run_number }}

      - name: Publish Linux to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_linux
          cp artifacts/four-in-a-row-Linux/four-in-a-row-linux.tar.gz push_linux/
          butler push push_linux shivamkr12/four-in-a-row:linux --userversion v${{ github.run_number }}

      - name: Publish macOS to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_mac
          cp artifacts/four-in-a-row-macOS/four-in-a-row-macos.zip push_mac/
          butler push push_mac shivamkr12/four-in-a-row:mac --userversion v${{ github.run_number }}
